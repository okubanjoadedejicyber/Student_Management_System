{% extends "layout.html" %}
{% block title %}Update Student{% endblock %}
{% block body %}
<section class="form-card">
  <h1>Update Student</h1>

  <form method="post" action="{{ url_for('update', id=student.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" value="{{ student.first_name }}" required>

    <label for="middle_name">Middle Name (Optional)</label>
    <input id="middle_name" name="middle_name" value="{{ student.middle_name or '' }}">

    <label for="surname">Surname</label>
    <input id="surname" name="surname" value="{{ student.surname }}" required>

    <label for="matric_number">Matric Number</label>
    <input id="matric_number" value="{{ student.matric_number }}" disabled>

    <p class="hint">Matric number cannot be changed on this form.</p>

    <label for="department">Department</label>
    <input id="department" name="department" value="{{ student.department }}" required>

    <label for="level">Level</label>
    <select id="level" name="level" required>
      {% for level in [100, 200, 300, 400, 500] %}
      <option value="{{ level }}" {% if student.level==level %}selected{% endif %}>
        {{ level }} Level
      </option>
      {% endfor %}
    </select>

    <button type="submit" class="button">Save Changes</button>
    <a class="button secondary" href="{{ url_for('staff_dashboard') }}">Cancel</a>
  </form>
</section>
{% endblock %}
