{% extends "layout.html" %} {% block body %}

<h1>Update Student</h1>

<form action="/update/{{ student.id }}" method="post">
  <label>Name</label>

  <input type="text" name="name" value="{{ student.name }}" required />

  <label>Matric Number</label>

  <input type="text" value="{{ student.matric_number }}" disabled />

  <label>Department</label>

  <input
    type="text"
    name="department"
    value="{{ student.department }}"
    required
  />

  <label>Level</label>

  <select name="level" required>
    <option value="100" {% if student.level == 100 %}selected{% endif %}>
      100
    </option>

    <option value="200" {% if student.level == 200 %}selected{% endif %}>
      200
    </option>

    <option value="300" {% if student.level == 300 %}selected{% endif %}>
      300
    </option>

    <option value="400" {% if student.level == 400 %}selected{% endif %}>
      400
    </option>

    <option value="500" {% if student.level == 500 %}selected{% endif %}>
      500
    </option>
  </select>

  <button type="submit">Save Changes</button>
</form>

{% endblock %}
