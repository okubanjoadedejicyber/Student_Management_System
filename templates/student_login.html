{% extends "layout.html" %}
{% block title %}Student Login{% endblock %}
{% block body %}
<section class="form-card">
    <h1>Student Login</h1>

    <form method="post" action="{{ url_for('student_login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="matric_number">Matric Number</label>
        <input id="matric_number" name="matric_number" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="button">Log In</button>
    </form>

    <p>New student? <a href="{{ url_for('student_register') }}">Register here</a></p>
    <a href="{{ url_for('landing') }}">Back to Home</a>
</section>
{% endblock %}
