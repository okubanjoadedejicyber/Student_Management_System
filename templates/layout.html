<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Management System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('landing') }}">Student Management System</a>
    {% if session.get("user_id") %}
    <form action="{{ url_for('logout') }}" method="post" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="button secondary">Log Out</button>
    </form>
    {% endif %}
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p class="message {{ category }}">{{ message }}</p>
    {% endfor %}
    {% endwith %}

    {% block body %}{% endblock %}
  </main>

  <footer class="site-footer">Student Management System</footer>
</body>

</html>
